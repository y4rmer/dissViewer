<!DOCTYPE html>

<head>

<title>dissViewer | Welcome</title>
<link href='favicon.ico' rel='shortcut icon'>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden;color:#fff;background:radial-gradient(ellipse at 50% 42%,#123e70 0%,#0b1c32 38%,#050a13 100%);display:flex;align-items:center;justify-content:center}
body:before{content:"";position:fixed;inset:-15%;pointer-events:none;background:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:52px 52px;transform:perspective(700px) rotateX(58deg) scale(1.5) translateY(18%);mask-image:linear-gradient(transparent,#000 45%,transparent)}
.glow{position:fixed;width:440px;height:440px;border-radius:50%;filter:blur(100px);background:#087cff;opacity:.22;pointer-events:none}
.glow.a{top:-250px;left:-150px}.glow.b{right:-220px;bottom:-250px;background:#164bba}
.scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:space-between;padding:7vh 5vw;pointer-events:none;opacity:.34}
.desktop{position:relative;width:min(43vw,560px);aspect-ratio:1.48;border:1px solid #ffffff70;border-radius:17px;padding:12px 12px 34px;background:linear-gradient(145deg,#233752,#050c18);box-shadow:0 35px 100px #000a;transform:perspective(1000px) rotateY(13deg) rotateX(4deg) translateX(-5%)}
.screen{height:100%;overflow:hidden;border-radius:8px;background:#101c2d}
.top{height:23px;background:#dfe8f4;padding:7px;display:flex;gap:5px}.top i{width:6px;height:6px;border-radius:50%;background:#71839a}
.tiles{height:calc(100% - 23px);display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px;background:linear-gradient(130deg,#0b1727,#142b49)}
.tile{border-radius:7px;background:linear-gradient(145deg,#1e6ac0,#091321 72%)}
.tile:nth-child(2){background:linear-gradient(145deg,#536e9b,#0b1524 75%)}.tile:nth-child(3){background:linear-gradient(145deg,#147d9a,#101827 75%)}
.stand{position:absolute;bottom:8px;left:38%;width:24%;height:23px;background:#60748d;clip-path:polygon(35% 0,65% 0,78% 100%,22% 100%)}
.phone{position:relative;width:min(19vw,225px);min-width:145px;aspect-ratio:9/18.5;border:1px solid #ffffff80;border-radius:32px;padding:8px;background:linear-gradient(145deg,#293d59,#050c18);box-shadow:0 30px 90px #000b;transform:perspective(900px) rotateY(-17deg) rotateZ(5deg) translateX(5%)}
.phone-screen{height:100%;border-radius:24px;overflow:hidden;background:#101b2b;padding:28px 9px 9px}
.notch{position:absolute;top:8px;left:33%;width:34%;height:13px;background:#050a12;border-radius:0 0 10px 10px}
.phone-title{font-size:10px;font-weight:bold;padding:3px 5px 12px}
.phone-image{height:65%;border-radius:10px;background:radial-gradient(circle at 52% 32%,#5cadffbf,transparent 22%),linear-gradient(145deg,#1d5791,#091321 68%)}
.lines{padding:12px 3px}.lines i{display:block;height:5px;margin:7px 0;border-radius:6px;background:#ffffff55}.lines i:last-child{width:58%}
.content{position:relative;z-index:2;width:min(760px,92vw);min-height:100vh;margin:auto;padding:7vh 0 5vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{display:block;width:min(370px,68vw);max-height:145px;object-fit:contain;margin:0 auto 25px;filter:drop-shadow(0 10px 30px #0008)}
.eyebrow{margin:0 0 12px;color:#8dbfff;font-size:11px;font-weight:800;letter-spacing:.28em;text-transform:uppercase}
h1{margin:0;font-size:clamp(30px,5vw,54px);line-height:1.05;letter-spacing:-.045em;font-weight:850;text-shadow:0 5px 30px #0006}
.subtitle{max-width:520px;margin:17px auto 30px;color:#bdcce0;font-size:clamp(14px,1.8vw,17px);line-height:1.65}
.actions{width:min(100%,520px);display:grid;grid-template-columns:1fr 1fr;gap:13px}
.action{min-height:58px;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px;border:1px solid #ffffff33;border-radius:12px;color:white;background:#ffffff16;backdrop-filter:blur(12px);text-decoration:none;font-size:14px;font-weight:750;transition:.2s}
.action:hover{transform:translateY(-3px);border-color:#6eb4ff;background:#ffffff26;box-shadow:0 12px 35px #0004}
.action.primary{grid-column:1/-1;border-color:#1680ff;background:linear-gradient(135deg,#1680ff,#075bd1);box-shadow:0 12px 35px #0066ff47}
.action.primary:hover{background:linear-gradient(135deg,#3694ff,#0868e9)}
.action svg{width:20px;height:20px;flex:none}
.footer{margin-top:34px;color:#cddcf099;font-size:11px;letter-spacing:.08em}
@media(max-width:650px){.scene{justify-content:center;padding:0}.desktop{width:88vw;opacity:.38;transform:perspective(900px) rotateY(10deg) scale(.9)}.phone{position:absolute;right:-22px;bottom:4vh;width:35vw;opacity:.62;transform:rotate(9deg)}.content{padding:8vh 0 5vh}.logo{width:min(310px,76vw);margin-bottom:22px}.subtitle{margin-bottom:25px}.actions{grid-template-columns:1fr;gap:11px;width:min(100%,390px)}.action.primary{grid-column:auto;grid-row:1}.action{min-height:54px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>

 </div>
 <div class="footer">dissViewer &nbsp;•&nbsp; CONNECT YOUR WAY</div>
